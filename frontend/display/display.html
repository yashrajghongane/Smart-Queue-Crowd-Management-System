<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Queue - Public Display</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #000; color: #fff; margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    h1 { font-size: 4rem; margin: 0 0 1rem 0; color: #aaa; }
    .serving-box { background: #111; border: 4px solid #333; padding: 4rem; border-radius: 1rem; text-align: center; min-width: 50vw; }
    .label { font-size: 2rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; }
    .token { font-size: 12rem; font-weight: bold; color: #0f0; margin: 1rem 0; line-height: 1; }
    .room { font-size: 3rem; color: #fff; }
    .next-box { margin-top: 3rem; font-size: 2.5rem; color: #888; }
    .next-token { color: #fff; font-weight: bold; }
    .error { color: red; font-size: 2rem; margin-top: 2rem; display: none; }
  </style>
</head>
<body>
  <h1 id="dept-name">LOADING...</h1>

  <div class="serving-box">
    <div class="label">Now Serving</div>
    <div class="token" id="current-token">--</div>
    <div class="room">Room <span id="room-name">-</span></div>
  </div>

  <div class="next-box">
    Next: <span class="next-token" id="next-token">--</span>
  </div>

  <div id="error-message" class="error">Display Offline</div>

  <script src="../shared/api.js"></script>
  <script src="display.js"></script>
</body>
</html>
